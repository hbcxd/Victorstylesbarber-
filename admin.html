<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Víctor Styles</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --fondo-oscuro: #0c0c0e; 
            --fondo-tarjeta: #151518;
            --fondo-input: #1a1a1f;
            --gris-texto: #e2e2e5;
            --gris-secundario: #a1a1aa;
            --dorado-acento: #c5a059; 
            --dorado-brillante: #e8c77a;
            --bronce-oscuro: #947032;
            --verde-exito: #10b981;
            --rojo-alerta: #ef4444; 
            --naranja-alerta: #f59e0b;
            --borde-sutil: rgba(197, 160, 89, 0.15);
            --shadow-premium: 0 12px 35px -10px rgba(0, 0, 0, 0.6);
            --gradiente-metal: linear-gradient(135deg, var(--bronce-oscuro) 0%, var(--dorado-brillante) 45%, var(--dorado-acento) 75%, var(--bronce-oscuro) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; }
        body { background-color: var(--fondo-oscuro); color: var(--gris-texto); padding-top: 85px; }

        /* --- NUEVOS ESTILOS PARA FIDELIDAD --- */
        .vip-card { background: var(--fondo-input); border-radius: 16px; padding: 20px; text-align: center; position: relative; border: 1px solid var(--borde-sutil); box-shadow: var(--shadow-premium); transition: transform 0.3s;}
        .vip-card:hover { transform: translateY(-5px); }
        .vip-oro { border-color: #e8c77a; }
        .vip-plata { border-color: #a1a1aa; }
        .vip-bronce { border-color: #947032; }
        .corona-vip { position: absolute; top: -15px; right: -10px; font-size: 5rem; opacity: 0.05; user-select: none; }
        .avatar-inicial { width: 45px; height: 45px; border-radius: 50%; background: var(--gradiente-metal); color: #0c0c0e; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 900; margin: 0 auto 12px auto; text-transform: uppercase;}
        .badge-nivel { padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
        .badge-nuevo { background: rgba(16, 185, 129, 0.1); color: var(--verde-exito); border: 1px solid var(--verde-exito);}
        .badge-frecuente { background: rgba(232, 199, 122, 0.1); color: var(--dorado-brillante); border: 1px solid var(--dorado-acento);}
        .badge-elite { background: rgba(245, 158, 11, 0.1); color: var(--naranja-alerta); border: 1px solid var(--naranja-alerta);}
        .buscador-clientes { width: 100%; padding: 16px; background-color: var(--fondo-input); border: 1px solid var(--borde-sutil); color: #fff; border-radius: 12px; outline: none; font-size: 0.95rem; margin-bottom: 25px; }

        /* Estilos base existentes (sin cambios) */
        header { display: flex; justify-content: center; align-items: center; padding: 0 5%; background-color: rgba(12, 12, 14, 0.85); backdrop-filter: blur(25px); position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid var(--borde-sutil); height: 75px; }
        .tab-btn { background: transparent; color: var(--gris-secundario); border: none; padding: 12px 18px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        .tab-btn.active { color: var(--dorado-brillante); }
        .modulo-admin { display: none; padding: 0 5%; max-width: 1200px; margin: 0 auto; }
        .modulo-admin.active { display: block; }
        h2 { font-size: 1.6rem; text-align: center; margin-bottom: 25px; background: linear-gradient(180deg, #ffffff 0%, var(--dorado-acento) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .seccion-bloque { background-color: var(--fondo-tarjeta); border: 1px solid var(--borde-sutil); border-radius: 20px; padding: 26px; margin-bottom: 28px; }
        .btn-accion { background: transparent; border: 1px solid var(--borde-sutil); color: var(--dorado-brillante); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: var(--fondo-input); border-radius: 16px; overflow: hidden; }
        th, td { padding: 16px; border-bottom: 1px solid var(--borde-sutil); font-size: 0.9rem; text-align: left; }
    </style>
</head>
<body>

<nav class="tabs-container" id="navegacionTabs">
    <button class="tab-btn active" onclick="cambiarTab('tab-dashboard', this)">Resumen</button>
    <button class="tab-btn" onclick="cambiarTab('tab-agenda', this)">Agenda</button>
    <button class="tab-btn" onclick="cambiarTab('tab-clientes', this)">Clientes</button>
</nav>

<div id="tab-clientes" class="modulo-admin">
    <h2>Fidelidad de Clientes</h2>
    <input type="text" id="buscadorClientes" class="buscador-clientes" placeholder="🔍 Buscar cliente por nombre o teléfono..." onkeyup="calcularFrecuencias()">

    <div id="top-clientes-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px;">
        </div>

    <div class="seccion-bloque">
        <h3>Directorio General</h3>
        <div class="contenedor-tabla">
            <table>
                <thead><tr><th>Cliente</th><th>Nivel</th><th>Visitas</th><th>Última Vez</th><th>Acción</th></tr></thead>
                <tbody id="tabla-frecuencia-cuerpo"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ... (Mantén tus funciones de Auth y Carga intactas) ...

    function calcularFrecuencias() {
        const map = {};
        const busqueda = (document.getElementById('buscadorClientes')?.value || '').toLowerCase();

        todasLasCitas.forEach(c => {
            if((c.estado||'Atendido')!=='Atendido') return;
            const tlf = c.cliente_telefono || 'S/N';
            if(!map[tlf]) map[tlf] = { nombre: c.cliente_nombre || 'Sin Nombre', visitas: 0, ultima: c.cita_fecha, id: c.id, telefono: tlf };
            map[tlf].visitas++;
            if(new Date(c.cita_fecha) > new Date(map[tlf].ultima)) { map[tlf].ultima = c.cita_fecha; map[tlf].id = c.id; }
        });

        let arr = Object.values(map).filter(c => 
            c.nombre.toLowerCase().includes(busqueda) || 
            c.telefono.toLowerCase().includes(busqueda)
        ).sort((a,b) => b.visitas - a.visitas);

        const topContainer = document.getElementById('top-clientes-container');
        const tbody = document.getElementById('tabla-frecuencia-cuerpo');
        topContainer.innerHTML = '';
        tbody.innerHTML = '';

        // TOP 3 VIP (Solo si no hay búsqueda activa)
        if (busqueda === '' && arr.length > 0) {
            const top3 = arr.slice(0, 3);
            const medallas = ['oro', 'plata', 'bronce'];
            const colores = ['#e8c77a', '#a1a1aa', '#947032'];
            const coronas = ['👑', '⭐', '👍'];

            top3.forEach((c, index) => {
                topContainer.innerHTML += `
                    <div class="vip-card vip-${medallas[index]}">
                        <div class="corona-vip">${coronas[index]}</div>
                        <div class="avatar-inicial" style="background: ${colores[index]};">${c.nombre.charAt(0)}</div>
                        <h4 style="color: #fff; margin-bottom: 4px;">${c.nombre}</h4>
                        <div style="font-size: 0.8rem; color: var(--gris-secundario); margin-bottom: 12px;">${c.telefono}</div>
                        <button class="btn-accion" style="width:100%; border-color:${colores[index]};" onclick="abrirModalDetalle('${c.id}')">Ver Perfil</button>
                    </div>
                `;
            });
        }

        // Tabla General
        arr.forEach(c => {
            let badge = c.visitas === 1 ? '<span class="badge-nivel badge-nuevo">Nuevo</span>' : 
                        c.visitas <= 4 ? '<span class="badge-nivel badge-frecuente">Frecuente</span>' : 
                        '<span class="badge-nivel badge-elite">Élite</span>';

            tbody.innerHTML += `<tr>
                <td><strong>${c.nombre}</strong><br><small style="color:var(--gris-secundario)">${c.telefono}</small></td>
                <td>${badge}</td>
                <td style="font-weight:900; color:var(--dorado-brillante);">${c.visitas}</td>
                <td>${c.ultima.split('-').reverse().join('/')}</td>
                <td><button class="btn-accion" onclick="abrirModalDetalle('${c.id}')">Detalle</button></td>
            </tr>`;
        });
    }
</script>
</body>
</html>
