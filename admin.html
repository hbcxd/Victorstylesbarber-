<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Víctor Styles</title>
    <style>
        /* Variables de color para mantener la consistencia minimalista */
        :root {
            --fondo-oscuro: #121212;
            --fondo-tarjeta: #1a1a1a;
            --gris-texto: #e0e0e0;
            --gris-secundario: #a0a0a0;
            --rojo-acento: #cc0000;
            --rojo-hover: #b30000;
        }

        /* Configuración General */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--fondo-oscuro);
            color: var(--gris-texto);
            padding-top: 90px; /* Espacio para que la barra fija no tape el contenido */
        }

        h2 {
            text-align: center;
            font-size: 2rem;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: var(--gris-secundario);
            margin-bottom: 30px;
        }

        /* ==========================================================================
           BARRA DE NAVEGACIÓN Y MENÚ DESPLEGABLE (IGUAL A INDEX)
           ========================================================================== */
        header {
            display: flex;
            flex-direction: row; 
            justify-content: space-between;
            align-items: center;        
            padding: 10px 4%;          
            background-color: #121212;  
            position: fixed;            
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            border-bottom: 1px solid #222;
            height: 70px;
        }

        /* Botón de Hamburguesa */
        .menu-hamburguesa {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 26px;
            height: 18px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1100;
        }

        .menu-hamburguesa span {
            width: 100%;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        /* Animación de la hamburguesa */
        .menu-hamburguesa.open span:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
        }
        .menu-hamburguesa.open span:nth-child(2) {
            opacity: 0;
        }
        .menu-hamburguesa.open span:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
        }

        /* Panel Lateral Desplegable */
        .menu-desplegable {
            position: fixed;
            top: 0;
            left: -280px; 
            width: 280px;
            height: 100vh;
            background-color: #161616;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.7);
            z-index: 1050;
            display: flex;
            flex-direction: column;
            padding: 90px 30px 40px 30px;
            transition: left 0.3s ease-in-out;
        }

        .menu-desplegable.open {
            left: 0; 
        }

        .menu-desplegable a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 15px 0;
            border-bottom: 1px solid #222;
            transition: color 0.3s ease;
        }

        .menu-desplegable a:active, .menu-desplegable a:hover {
            color: var(--rojo-acento);
        }

        /* Enlace de administración resaltado activo */
        .menu-desplegable .link-admin-menu {
            margin-top: auto;
            color: var(--rojo-acento);
            font-size: 0.9rem;
            border: 1px solid var(--rojo-acento);
            border-radius: 4px;
            text-align: center;
            padding: 10px;
            background-color: #1a0c0c;
        }

        /* Contenedor del Logo */
        .logo {
            display: flex;
            align-items: center;
            flex-shrink: 0;            
        }

        .logo img {
            height: 55px;      
            width: auto;        
            display: block;
        }

        /* Capa de fondo oscura */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1040;
            display: none;
        }

        .menu-overlay.show {
            display: block;
        }

        /* ==========================================================================
           CONTENIDO DEL PANEL DE ADMINISTRACIÓN
           ========================================================================== */
        .admin-section {
            padding: 20px 5%;
            max-width: 900px;
            margin: 0 auto;
        }

        .contenedor-tabla {
            width: 100%;
            overflow-x: auto; /* Permite deslizar la tabla de lado en pantallas pequeñas */
            background-color: var(--fondo-tarjeta);
            border: 1px solid #252525;
            border-radius: 8px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px; /* Asegura que mantenga forma en móviles */
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #252525;
            font-size: 0.95rem;
        }

        th {
            background-color: #111111;
            color: #ffffff;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: #222222;
        }

        .btn-eliminar {
            background-color: var(--rojo-acento);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .btn-eliminar:active {
            background-color: var(--rojo-hover);
        }

        .sin-citas {
            text-align: center;
            padding: 30px;
            color: var(--gris-secundario);
            font-style: italic;
        }
    </style>
</head>
<body>

<!-- Capa oscura trasera del menú -->
<div class="menu-overlay" id="menuOverlay"></div>

<!-- Encabezado con Botón de Hamburguesa Izquierda y Logo Derecha -->
<header>
    <button class="menu-hamburguesa" id="btnHamburguesa">
        <span></span>
        <span></span>
        <span></span>
    </button>
    
    <div class="logo"> 
        <img src="LOGO.png" alt="Logo Víctor Styles">
    </div>
</header>

<!-- Menú Desplegable Lateral (Redirecciona a index.html) -->
<nav class="menu-desplegable" id="menuLateral">
    <a href="index.html#inicio" class="menu-link">Inicio</a>
    <a href="index.html#galeria" class="menu-link">Cortes</a>
    <a href="index.html#precios" class="menu-link">Servicios</a>
    <a href="index.html#agenda" class="menu-link">Agendar Cita</a>
    <a href="admin.html" class="link-admin-menu">Panel Administrador</a>
</nav>

<!-- Panel de Control Principal -->
<section class="admin-section">
    <h2>Citas Reservadas</h2>
    <p class="subtitulo">Gestión, control y seguimiento de los turnos en tiempo real.</p>

    <div class="contenedor-tabla">
        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Teléfono</th>
                    <th>Servicio</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tabla-citas-cuerpo">
                <!-- Los datos de Firebase se cargarán dinámicamente aquí -->
            </tbody>
        </table>
    </div>
</section>

<script>
    // Lógica idéntica para abrir y cerrar el menú desplegable lateral
    const btnHamburguesa = document.getElementById('btnHamburguesa');
    const menuLateral = document.getElementById('menuLateral');
    const menuOverlay = document.getElementById('menuOverlay');
    const linksMenu = document.querySelectorAll('.menu-desplegable a');

    function toggleMenu() {
        btnHamburguesa.classList.toggle('open');
        menuLateral.classList.toggle('open');
        menuOverlay.classList.toggle('show');
    }

    btnHamburguesa.addEventListener('click', toggleMenu);
    menuOverlay.addEventListener('click', toggleMenu);

    linksMenu.forEach(link => {
        link.addEventListener('click', toggleMenu);
    });

    // ==========================================================================
    // INTEGRACIÓN Y CONTROLADOR DE DATOS DE LA BASE DE DATOS (FIREBASE REALTIME)
    // ==========================================================================
    const FIREBASE_URL = 'https://barberia-victor-default-rtdb.firebaseio.com/';
    const tablaCuerpo = document.getElementById('tabla-citas-cuerpo');

    // Función principal para leer y renderizar las citas desde la nube
    function cargarCitas() {
        tablaCuerpo.innerHTML = '<tr><td colspan="6" style="text-align: center;">Cargando lista de turnos...</td></tr>';

        fetch(`${FIREBASE_URL}citas.json`)
            .then(response => response.json())
            .then(data => {
                tablaCuerpo.innerHTML = '';

                if (!data) {
                    tablaCuerpo.innerHTML = '<tr><td colspan="6" class="sin-citas">No hay citas registradas en el sistema.</td></tr>';
                    return;
                }

                // Transformamos el objeto de Firebase en una lista y lo ordenamos por fecha
                const listaCitas = Object.keys(data).map(id => ({
                    id: id,
                    ...data[id]
                })).sort((a, b) => new Date(a.cita_fecha) - new Date(b.cita_fecha));

                listaCitas.forEach(cita => {
                    const fila = document.createElement('tr');

                    // Formateo visual sutil de la fecha (AAAA-MM-DD a DD/MM/AAAA)
                    let fechaFormateada = cita.cita_fecha;
                    if(cita.cita_fecha) {
                        const partes = cita.cita_fecha.split('-');
                        if(partes.length === 3) fechaFormateada = `${partes[2]}/${partes[1]}/${partes[0]}`;
                    }

                    fila.innerHTML = `
                        <td><strong>${cita.cliente_nombre || 'Sin nombre'}</strong></td>
                        <td>${cita.cliente_telefono || 'Sin teléfono'}</td>
                        <td>${cita.servicio || 'No especificado'}</td>
                        <td>${fechaFormateada}</td>
                        <td><span style="color: #ffffff; font-weight: bold;">${cita.cita_hora || '---'}</span></td>
                        <td><button class="btn-eliminar" onclick="eliminarCita('${cita.id}')">Eliminar</button></td>
                    `;
                    tablaCuerpo.appendChild(fila);
                });
            })
            .catch(error => {
                console.error("Error al obtener datos de Firebase:", error);
                tablaCuerpo.innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Error de comunicación con la base de datos.</td></tr>';
            });
    }

    // Función global encargada de borrar el nodo de una cita mediante su ID de Firebase
    window.eliminarCita = function(idCita) {
        if (confirm("¿Estás seguro de que deseas eliminar y liberar este turno permanentemente?")) {
            fetch(`${FIREBASE_URL}citas/${idCita}.json`, {
                method: 'DELETE'
            })
            .then(() => {
                alert("La cita ha sido removida con éxito.");
                cargarCitas(); // Refresca la tabla automáticamente
            })
            .catch(error => {
                console.error("Error al borrar el registro:", error);
                alert("Hubo un error al intentar eliminar la cita.");
            });
        }
    }

    // Carga inicial automatizada al abrir el archivo administrador
    document.addEventListener('DOMContentLoaded', cargarCitas);
</script>
</body>
</html>
